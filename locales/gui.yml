gui.renodx_classic:
  en: "DLSS 5 add-on: install the classic build (4.55) — for a black screen, crash or driver reset"
  zh-CN: "DLSS 5 附加组件：改装经典版 (4.55) —— 遇黑屏、崩溃或驱动重置时使用"
gui.renodx_steady:
  en: "DLSS 5 add-on: install 4.70 instead of the newest build — the last one with Enable Upscaling; the newer builds broke some games"
  zh-CN: "DLSS 5 附加组件：改装 4.70 而非最新构建 —— 这是最后一个带 Enable Upscaling（启用超分辨率）的版本；更新的构建弄坏了一些游戏"
gui.renodx_stable_only:
  en: "DLSS 5 add-on: stable builds only — skip release candidates (8.5.0-rc and similar test builds) when installing or updating to the newest build"
  zh-CN: "DLSS 5 附加组件：仅用稳定版 —— 安装或更新到最新构建时跳过候选版（RC，8.5.0-rc 及类似测试构建）"
gui.ada_mfg:
  en: "Unlock RTX 40 multi-frame generation (3X and above, up to 6X) — the game must have frame generation of its own"
  zh-CN: "解锁 RTX 40 多帧生成（3X 及以上，最高 6X）—— 游戏本身必须自带帧生成"
gui.anticheat_fmt:
  en: "%{ac} is switched off for offline play in this game (GTA V: BattlEye unticked in the Rockstar Games Launcher, or -nobattleye) — install anyway, at my own risk"
  zh-CN: "%{ac} 已在此游戏中为离线游玩关闭（GTA V：在 Rockstar Games Launcher 里取消勾选 BattlEye，或使用 -nobattleye）—— 仍要安装，风险自负"

# ── 安装页：多帧生成 ──────────────────────────────────────────
gui.mfg_head:
  en: "MULTI-FRAME GENERATION"
  zh-CN: "多帧生成"
gui.mfg_only_rtxmfg:
  en: "Multi-frame generation only · experimental: install Universal RTXMFG (dashdogy) and nothing else, no DLSS 5 and no ReShade. The game must have DLSS Frame Generation of its own; Backspace opens its menu"
  zh-CN: "仅多帧生成 · 实验性：只安装 Universal RTXMFG（dashdogy），不装 DLSS 5 也不装 ReShade。游戏本身必须自带 DLSS 帧生成；按 Backspace 打开其菜单"
gui.mfg_64bit_only:
  en: "64-bit DirectX 11/12 and Vulkan games only."
  zh-CN: "仅限 64 位 DirectX 11/12 与 Vulkan 游戏。"
gui.mfg_only_addon:
  en: "RTX 40 multi-frame generation add-on only (mavismmg): ReShade and that add-on, no DLSS 5. The game must have DLSS Frame Generation of its own"
  zh-CN: "仅 RTX 40 多帧生成附加组件（mavismmg）：ReShade 加该附加组件，不带 DLSS 5。游戏本身必须自带 DLSS 帧生成"
gui.mfg_rtxmfg_with:
  en: "Also install Universal RTXMFG (dashdogy) beside DLSS 5 for multi-frame generation · experimental. Replaces the build's own RTX 40 unlock; the game must have DLSS Frame Generation of its own"
  zh-CN: "在 DLSS 5 之外同时安装 Universal RTXMFG（dashdogy）以启用多帧生成 · 实验性。取代构建自带的 RTX 40 解锁；游戏本身必须自带 DLSS 帧生成"

