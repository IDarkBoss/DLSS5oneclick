gui.upstream_warn:
  en: "EXPERIMENTAL. Using DLSS Frame Generation? Set this add-on to Quality in the ReShade overlay, so the network runs on every frame. At any lower setting it runs on one frame in two or three, the rendered frame interval alternates, and frame generation cannot pace through the swing: stutter and flashes that get worse the higher the multiplier. Its author tested it against GTA V Enhanced and Bright Memory: Infinite only."
  zh-CN: "实验性。在用 DLSS 帧生成吗？请在 ReShade 悬浮层里把该附加组件设为 Quality（画质档位），让网络逐帧运行。任何更低的档位下它每两三帧才运行一次，渲染帧间隔随之交替，帧生成无法在这种波动中稳住节奏：卡顿与闪烁会随倍率提高而加重。其作者仅在 GTA V Enhanced 和 Bright Memory: Infinite 上测试过。"

