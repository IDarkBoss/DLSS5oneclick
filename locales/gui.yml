  zh-CN: "变换力度"
gui.upstream_p1:
  en: "Keeps the lighting work, holds back invented detail."
  zh-CN: "保留光照处理，克制凭空生成的细节。"
gui.upstream_p2:
  en: "Half way: detail is enhanced but not rebuilt."
  zh-CN: "折中：细节得到增强但不重建。"
gui.upstream_p3:
  en: "Everything the network wants to do. Its own default."
  zh-CN: "网络想做的全部。它自己的默认。"
gui.upstream_p4:
  en: "Past what the network intends — detail starts looking drawn."
