gui.engine_head:
  en: "INSTALL ENGINE"
  zh-CN: "安装引擎"
gui.engine_three_ways:
  en: "— three ways to run DLSS 5 in this game, pick one"
  zh-CN: "—— 在这款游戏中运行 DLSS 5 有三种方式，选其一"
gui.engine_no_dlss:
  en: "— this game has no DLSS of its own: the ReShade path, or the standalone AIO"
  zh-CN: "—— 这款游戏没有自带 DLSS：走 ReShade 路线，或独立 AIO"
gui.eng_reshade_title:
  en: "ReShade + DLSS 5 add-on"
  zh-CN: "ReShade + DLSS 5 附加组件"
gui.eng_reshade_l1:
  en: "The default. Works in every supported game."
  zh-CN: "默认方案。所有支持的游戏都能用。"
gui.eng_reshade_l2:
  en: "In game: Home → Add-ons → DLSS 5 Neural Rendering."
  zh-CN: "游戏内：Home → Add-ons → DLSS 5 Neural Rendering。"
gui.eng_opti_title:
  en: "OptiScaler (built-in NR pass)"
  zh-CN: "OptiScaler（内置神经渲染通道）"
gui.eng_opti_l1:
  en: "Dagherbou's fork, no ReShade. Also swaps upscalers."
  zh-CN: "Dagherbou 的分支，无需 ReShade。还能切换超分辨率方案。"
gui.eng_opti_l2:
  en: "In game: Insert → enable Neural Rendering."
  zh-CN: "游戏内：按 Insert → 启用 Neural Rendering。"
gui.eng_needs_own_dlss:
  en: "Needs a game with its own DLSS — this one has none."
  zh-CN: "需要游戏自带 DLSS —— 这款没有。"
gui.eng_aio_title:
  en: "ReShade + standalone AIO · experimental"
  zh-CN: "ReShade + 独立 AIO · 实验性"
gui.eng_aio_l1:
  en: "kibblerz's all-in-one: neural rendering, super resolution, frame generation."
  zh-CN: "kibblerz 的全能包：神经渲染、超分辨率、帧生成。"
gui.eng_aio_l2:
  en: "In game: Home → Add-ons → Standalone DLSS-NR + SR. Windowed mode recommended."
  zh-CN: "游戏内：Home → Add-ons → Standalone DLSS-NR + SR。建议使用窗口模式。"
gui.eng_64bit_only:
  en: "64-bit games only."
  zh-CN: "仅限 64 位游戏。"
gui.eng_needs_reshade:
  en: "Needs a game ReShade can reach from dxgi.dll."
  zh-CN: "需要 ReShade 能通过 dxgi.dll 接入的游戏。"
gui.card_state_selected:
  en: "SELECTED"
  zh-CN: "已选择"
gui.card_state_choose:
  en: "CHOOSE"
  zh-CN: "选择"
gui.card_state_unavailable:
  en: "UNAVAILABLE"
  zh-CN: "不可用"

# ── 安装页：OptiScaler 构建 ───────────────────────────────────
gui.opti_build_head:
  en: "OPTISCALER BUILD"
  zh-CN: "OPTISCALER 构建"
gui.opti_build_stable:
  en: "Stable"
  zh-CN: "稳定版"
gui.opti_build_presr:
  en: "Pre-SR multipass · experimental"
  zh-CN: "Pre-SR 多通道 · 实验性"
gui.opti_stable_note:
  en: "Dagherbou's build: the network runs after super resolution. The one most people are running."
  zh-CN: "Dagherbou 的构建：网络在超分辨率之后运行。多数人在用的版本。"
gui.opti_presr_note:
  en: "wilsjo2's fork: the network runs BEFORE super resolution, on the smaller image, in 1-3 passes. Bigger download (about 160 MB) and barely tested here — report what you see."
  zh-CN: "wilsjo2 的分支：网络在超分辨率之前、在更小的图像上以 1-3 个通道运行。下载更大（约 160 MB），此处几乎未测试 —— 见到什么请反馈。"
gui.opti_ada_mfg:
  en: "RTX 40 multi-frame generation — built into this build, no extra files. The game must have frame generation of its own."
  zh-CN: "RTX 40 多帧生成 —— 内置于该构建，无需额外文件。游戏本身必须自带帧生成。"
gui.ampere_mfg:
  en: "Unlock multi-frame generation on this RTX 20/30 card (3X–4X) — the game must have DLSS frame generation of its own · experimental"
  zh-CN: "在此 RTX 20/30 显卡上解锁多帧生成（3X–4X）—— 游戏本身必须自带 DLSS 帧生成 · 实验性"
gui.ampere_mfg_note:
  en: "Installs ShyVortex's OptiScaler build (wilsjo2's pre-SR fork plus sdli1995's Turing/Ampere unlock and the Streamline runtime) in place of the build above. One report of it failing on Forza Horizon 6 on RTX 20."
  zh-CN: "改装 ShyVortex 的 OptiScaler 构建（wilsjo2 的 pre-SR 分支，加上 sdli1995 的 Turing/Ampere 解锁与 Streamline 运行时）以取代上方构建。有一例在 RTX 20 上运行 Forza Horizon 6 失败的报告。"
gui.opti_fg:
  en: "Frame generation (2X, FSR 3.1 inside OptiScaler) — any RTX card. Turn the game's own frame generation off; expect added latency."
  zh-CN: "帧生成（2X，OptiScaler 内置 FSR 3.1）—— 任意 RTX 显卡可用。请关闭游戏自带帧生成；延迟会有所增加。"
gui.model_res_head:
  en: "MODEL RESOLUTION"
  zh-CN: "模型分辨率"
gui.model_res_note:
  en: "— the frame stays full size; only the model's own work is done smaller"
  zh-CN: "—— 画面保持全尺寸；仅模型自身的工作以较小尺寸进行"
gui.model_cost_full:
  en: "full cost"
  zh-CN: "全量开销"
gui.model_cost_half:
  en: "about half the cost"
  zh-CN: "约一半开销"
gui.model_cost_quarter:
  en: "about a quarter"
  zh-CN: "约四分之一"
gui.model_run_full:
  en: "The model runs at full output resolution."
  zh-CN: "模型以完整输出分辨率运行。"
gui.model_run_half:
  en: "Costs about half as much; the biggest single fps lever here."
  zh-CN: "开销约为一半；此处提升帧率最有效的一档。"
gui.model_run_quarter:
  en: "Costs about a quarter; the model's contribution is softer."
  zh-CN: "开销约四分之一；模型的贡献偏软。"
gui.model_flicker_note:
  en: "This OptiScaler build flickers and keeps settling after the camera stops at any model resolution below 100% (a known bug in the pre-SR fork it is built on). Pick 100% if you see that."
  zh-CN: "该 OptiScaler 构建在模型分辨率低于 100% 时会闪烁、且镜头停止后画面仍在收敛（其所基于的 pre-SR 分支的已知缺陷）。遇到这种情况请选 100%。"

# ── 安装页：神经附加组件 ──────────────────────────────────────
gui.consumer_head:
  en: "WHICH NEURAL ADD-ON"
  zh-CN: "选择神经附加组件"
gui.consumer_with_dlss:
  en: "— all of them run DLSS 5; the DLSS 5 add-on is the default for a game with its own DLSS"
  zh-CN: "—— 它们都能运行 DLSS 5；对自带 DLSS 的游戏，默认用 DLSS 5 附加组件"
gui.consumer_no_dlss:
  en: "— only the DLSS 5 add-on works in a game with no DLSS of its own"
  zh-CN: "—— 对没有自带 DLSS 的游戏，只有 DLSS 5 附加组件可用"
gui.eng_sf_title:
  en: "ShortFuse's DLSS add-on"
  zh-CN: "ShortFuse 的 DLSS 附加组件"
gui.eng_sf_l1:
  en: "From the author of RenoDX. Hooks the game's own DLSS in DX11 and DX12, so no bridge."
  zh-CN: "出自 RenoDX 作者。在 DX11 与 DX12 下挂钩游戏自带 DLSS，因此无需桥接。"
gui.eng_sf_l2:
  en: "In game: Home → Add-ons → RenoDX DLSS."
  zh-CN: "游戏内：Home → Add-ons → RenoDX DLSS。"
gui.eng_sf_note:
  en: "Needs a 64-bit game with its own DLSS."
  zh-CN: "需要 64 位且自带 DLSS 的游戏。"
gui.eng_stable_title:
  en: "Default — RenoDX DLSS 5 add-on"
  zh-CN: "默认 —— RenoDX DLSS 5 附加组件"
gui.eng_stable_l1:
  en: "Newest build. On 8.x it runs before the game's upscale (Render hook point), set for you."
  zh-CN: "最新构建。在 8.x 上运行于游戏升采样之前（Render 挂钩点），已为你设好。"
gui.eng_stable_l2:
  en: "In game: Home → Add-ons → DLSS 5 Neural Rendering."
  zh-CN: "游戏内：Home → Add-ons → DLSS 5 Neural Rendering。"
gui.eng_up_title:
  en: "Experimental — Neural Upstream"
  zh-CN: "实验性 —— Neural Upstream"
gui.eng_up_l1:
  en: "Runs the network before the upscaler, at render resolution, so it costs less."
  zh-CN: "在升采样器之前、以渲染分辨率运行网络，因此开销更低。"
gui.eng_up_l2:
  en: "Replaces the other add-ons. Read the warning below first."
  zh-CN: "会替代其他附加组件。请先阅读下方警告。"
