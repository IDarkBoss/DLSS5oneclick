[package]
name = "dlss5oneclick"
version = "0.14.26"
edition = "2021"
description = "One-click DLSS 5 neural rendering setup for DX11/DX12 games that ship without DLSS"
license = "MIT"
repository = "https://github.com/faisalkindi/DLSS5oneclick"
build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
rfd = "0.17"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
regex = "1"
anyhow = "1"
tempfile = "3"
sha2 = "0.10"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rust-i18n = "4.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

[dev-dependencies]
# i18n.rs 的 key 一致性测试用它解析 locales/*.yml（与 rust-i18n 同一个 YAML 栈）。
serde-saphyr = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
